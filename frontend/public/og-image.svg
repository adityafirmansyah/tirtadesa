<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#0369a1" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg)" />

  <!-- Badge -->
  <rect x="100" y="90" width="380" height="42" rx="21" fill="#0284c7" fill-opacity="0.25" stroke="#38bdf8" stroke-width="1.5" />
  <text x="120" y="117" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="700" fill="#7dd3fc" letter-spacing="1">
    SISTEM INFORMASI AIR BERSIH DESA
  </text>

  <!-- Brand Title -->
  <text x="100" y="220" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="76" font-weight="900" fill="#ffffff" letter-spacing="-1">
    TirtaDesa
  </text>

  <!-- Subtitle / Tagline -->
  <text x="100" y="285" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="30" font-weight="600" fill="#bae6fd">
    Aplikasi Catat Meter &amp; Billing Air Swadaya Desa
  </text>

  <!-- Value Description -->
  <text x="100" y="345" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="20" fill="#94a3b8">
    Platform open-source untuk KPSPAMS, HIPPAM, PAM Desa &amp; BUMDes Air di Indonesia.
  </text>
  <text x="100" y="375" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="20" fill="#94a3b8">
    Catat meter offline PWA, tarif bertingkat, cetak kasir thermal 58mm &amp; neraca publik.
  </text>

  <!-- Divider -->
  <line x1="100" y1="430" x2="1100" y2="430" stroke="#334155" stroke-width="1.5" />

  <!-- Feature Highlights Pill Row -->
  <rect x="100" y="470" width="220" height="50" rx="10" fill="#1e293b" stroke="#334155" />
  <text x="130" y="502" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="600" fill="#f8fafc">
    Catat Meter Offline
  </text>

  <rect x="340" y="470" width="240" height="50" rx="10" fill="#1e293b" stroke="#334155" />
  <text x="370" y="502" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="600" fill="#f8fafc">
    Cetak Struk Thermal 58mm
  </text>

  <rect x="600" y="470" width="220" height="50" rx="10" fill="#1e293b" stroke="#334155" />
  <text x="630" y="502" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="600" fill="#f8fafc">
    Audit Neraca Air (NRW)
  </text>

  <rect x="840" y="470" width="260" height="50" rx="10" fill="#0284c7" />
  <text x="870" y="502" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="700" fill="#ffffff">
    100% Open Source MIT
  </text>

  <!-- Water Drop Icon Graphic on Right -->
  <g transform="translate(930, 110)">
    <circle cx="90" cy="90" r="85" fill="#0284c7" fill-opacity="0.15" />
    <path d="M90 25 C90 25, 45 90, 45 125 A45 45 0 0 0 135 125 C135 90, 90 25, 90 25 Z" fill="#38bdf8" />
  </g>
</svg>
