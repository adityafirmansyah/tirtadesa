name: Lint & Test

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  backend-lint-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          cd backend
          python -m pip install --upgrade pip
          pip install ruff pytest httpx alembic
          pip install -r requirements.txt

      - name: Run Ruff Lint & Format Check
        run: |
          cd backend
          ruff check .
          ruff format --check .

      - name: Run Migrations Check
        run: |
          cd backend
          alembic upgrade head

      - name: Run Tests
        run: |
          cd backend
          pytest -v

  frontend-lint-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: |
          cd frontend
          npm ci

      - name: Run Typecheck & Build
        run: |
          cd frontend
          npm run build
